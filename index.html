<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<title>Print Marking | Corporate Printing & Gifting</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://cdn.tailwindcss.com"></script>

<style>
@keyframes float {
0%, 100% { transform: translateY(0px) rotate(0deg); }
50% { transform: translateY(-20px) rotate(1deg); }
}

@keyframes pulse-glow {
0%, 100% { opacity: 0.3; transform: scale(1); }
50% { opacity: 0.6; transform: scale(1.1); }
}

.logo-container { perspective: 1000px; }
.premium-logo { transition: transform 0.2s ease-out, filter 0.3s ease; will-change: transform; }
.logo-float { animation: float 6s ease-in-out infinite; }

@keyframes scroll {
0% { transform: translateX(0); }
100% { transform: translateX(-50%); }
}

.conveyor-belt {
display: flex;
width: fit-content;
animation: scroll 30s linear infinite;
}

.product-item {
flex: 0 0 auto;
width: 130px;
margin: 0 10px;
transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@media (min-width: 768px) {
.product-item { width: 200px; margin: 0 30px; }
}

.product-item img {
width: 100%;
height: 120px;
object-fit: contain;
}

@media (min-width: 768px) {
.product-item img { height: 150px; }
}

.product-item:hover {
transform: scale(1.3) translateY(-20px);
}

#bg-canvas {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: -1;
background-color: #fff;
}
</style>

<script>
tailwind.config = {
theme: {
extend: {
colors: {
brandOrange: '#F68B2C',
brandDark: '#FFFFFF',
brandLight: '#1C1C1C'
}
}
}
}
</script>
</head>
