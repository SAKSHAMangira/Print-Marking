<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Us | Print Marking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    
    html { scroll-behavior: auto; }
    body { font-family: 'Inter', sans-serif; background-color: #FFFFFF; color: #1C1C1C; }

    /* --- MOBILE MENU & BLUR FIX --- */
    #main-content-wrapper { transition: filter 0.4s ease, transform 0.4s ease; }
    body.menu-open #main-content-wrapper { filter: blur(15px); transform: scale(0.95); }
    
    #mobile-menu {
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
      transform: translateY(-100%);
      opacity: 0;
      visibility: hidden;
      padding-top: 80px; 
    }
    #mobile-menu.active {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
    }

    /* Updated Premium Card for Light Mode */
    .premium-card {
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    
    .premium-card:hover {
      border-color: #F68B2C;
      box-shadow: 0 25px 50px -12px rgba(246, 139, 44, 0.15);
    }

    .form-input:focus {
      border-color: #F68B2C;
      box-shadow: 0 0 15px rgba(246, 139, 44, 0.1);
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease-out;
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .colorful-map {
      position: relative;
      border: 1px solid rgba(0, 0, 0, 0.05);
      overflow: hidden;
      border-radius: 2.5rem;
    }
    .colorful-map iframe {
        filter: saturate(1.2) contrast(1.1);
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandOrange: '#F68B2C',
            brandGray: '#F9F9F9',
          }
        }
      }
    }
  </script>
</head>

<body class="overflow-x-hidden">

        <path id="menu-path" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>

  <div id="mobile-menu" class="fixed inset-0 bg-white/95 backdrop-blur-3xl z-[250] flex flex-col items-center justify-start pt-32 gap-10 md:hidden">
    <a href="index.html" class="text-3xl font-black hover:text-brandOrange uppercase tracking-widest transition-colors">Home</a>

</nav>

                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>

            </div>

      </div>

      <div class="colorful-map flex-grow min-h-[300px]">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3501.5238210137747!2d77.19324707612662!3d28.64402688355655!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390cfd6621f37e5d%3A0xc3f837130f6a1e50!2sKarol%20Bagh%2C%20New%20Delhi%2C%20Delhi%20110005!5e0!3m2!1sen!2sin!4v1705000000000!5m2!1sen!2sin"

<footer class="bg-white py-12 text-center text-gray-400 text-sm border-t border-black/5 uppercase tracking-widest">

</div>

<script>
  // Mobile Menu Logic
  const menuBtn = document.getElementById('menu-btn');
  const mobileMenu = document.getElementById('mobile-menu');
  const menuPath = document.getElementById('menu-path');
  const body = document.body;

  menuBtn.addEventListener('click', () => {
    mobileMenu.classList.toggle('active');
    body.classList.toggle('menu-open'); 
    const isActive = mobileMenu.classList.contains('active');
    menuPath.setAttribute('d', isActive ? 'M6 18L18 6M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16');
    body.style.overflow = isActive ? 'hidden' : 'auto';
  });

  // Reveal Animation Logic
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('active');
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
